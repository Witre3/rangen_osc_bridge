ee_osc_bridge:
  ros__parameters:
    # ── OSC targets ─────────────────────────────────────────────────────────
    # Primary: composer's laptop (Max/MSP or TouchDesigner).
    osc_target_ip: "192.168.50.208"
    osc_target_port: 9001
    # Secondary: this machine's own osc_visualizer.py, so both sides can
    # watch the same stream. Leave osc_target_ip_2 empty ("") to disable.
    osc_target_ip_2: "127.0.0.1"
    osc_target_port_2: 9004

    # ── Send rate ────────────────────────────────────────────────────────────
    # Must be ≤ the IGPS odometry rate (~60 Hz on the real robot) so the
    # timer never outruns the pose source.  50 Hz is a safe default.
    send_rate_hz: 50.0

    # ── EMA smoothing ────────────────────────────────────────────────────────
    # Applied to both velocity and acceleration.
    # 1.0 = raw finite differences (very noisy), 0.0 = frozen.
    # 0.15 gives ~1–2 frame lag at 60 Hz incoming; increase if still noisy.
    smoothing_alpha: 0.15

    # ── Pose sources ─────────────────────────────────────────────────────────
    # Commanded EE pose (PoseStamped) — always available when teleop is running.
    pose_topic: "/ee_pose_ref"
    # Actual (measured) EE pose (PoseStamped, frame gen3_base_link).
    # Published by haply_delta_ee_pose: TF FK at 100 Hz, with IGPS odometry
    # as primary source when available.
    actual_pose_topic: "/ee_pose_actual"

    # ── Normalisation curves for /mag/norm outputs ───────────────────────────
    # Defaults to config/norm_curves.yaml in this package's share directory
    # (which, under --symlink-install, is a live symlink back to the source
    # file — so editing it in place, e.g. with scripts/curve_editor.py, is
    # enough). Override norm_curves_yaml here only if you want a different
    # curve file. This node polls the file's mtime and hot-reloads it, so no
    # restart is needed after saving new curves.
    # norm_curves_yaml: "/path/to/custom_norm_curves.yaml"
    norm_curves_reload_period_sec: 1.0
